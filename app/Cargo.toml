[package]
name = "clankban"
version = "0.2.0"
description = "A local-first visual workspace for humans and coding agents."
edition = "2021"
build = "build.rs"

[build-dependencies]
slint-build = "1.19"

[dependencies]
slint = "1.19"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
dirs = "5"
ureq = { version = "2", features = ["json"] }
percent-encoding = "2"
minisign-verify = "0.3"
base64 = "0.22"
arboard = "3"
